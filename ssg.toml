# Site configuration for corrallib.com, built with `make build`.
# The paths are relative to the repository root.

site_name = "Corral"
site_title = "Corral: clone and organise every repository you own"
site_description = "corralctl clones your repositories from GitHub, GitLab, Gitea, Forgejo, Codeberg and Bitbucket into one organised local layout, and serves them to AI coding agents over MCP."
base_url = "https://corrallib.com"
language = "en-GB"

content_dir = "_posts"
template_dir = "_layouts"
output_dir = "docs"

# Agentic discovery: /agents.txt, /.well-known/ai-plugin.json and
# /.well-known/mcp.json. Permissive, because the site exists to be read.
[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

# Security headers for hosts that read `_headers`. GitHub Pages ignores the
# file; it is kept so the same build deploys elsewhere with the headers.
[edge_headers]
targets = ["netlify", "cloudflare"]
