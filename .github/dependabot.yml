# The workflows pin every action by commit SHA. A SHA pin with no update
# automation only moves when someone remembers, so Dependabot watches it.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
